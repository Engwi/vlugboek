server:
  port: 8081
  forward-headers-strategy: framework
  tomcat:
    basedir: tmp/tomcat

spring:
  application:
    name: vlugboek
  datasource:
    url: ${VLUGBOEK_DATASOURCE_URL:jdbc:h2:file:./data/vlugboek;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: ${VLUGBOEK_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing Hibernate-managed schema
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

vlugboek:
  public-url: ${VLUGBOEK_PUBLIC_URL:http://localhost:5173}
  storage:
    uploads-dir: ${VLUGBOEK_UPLOADS_DIR:data/uploads}
  seed:
    pdf-root: ${VLUGBOEK_SEED_PDF_ROOT:Docs/Uitslae}
    reference-data-enabled: ${VLUGBOEK_SEED_REFERENCE_DATA_ENABLED:true}
    pdf-import-enabled: ${VLUGBOEK_SEED_PDF_IMPORT_ENABLED:true}
    admin-enabled: ${VLUGBOEK_SEED_ADMIN_ENABLED:true}
    admin-email: ${VLUGBOEK_SEED_ADMIN_EMAIL:admin@vlugboek.local}
    admin-name: ${VLUGBOEK_SEED_ADMIN_NAME:Admin}
    admin-password: ${VLUGBOEK_SEED_ADMIN_PASSWORD:admin123}
    demo-users-enabled: ${VLUGBOEK_SEED_DEMO_USERS_ENABLED:true}
    demo-email: ${VLUGBOEK_SEED_DEMO_EMAIL:demo@vlugboek.local}
    demo-name: ${VLUGBOEK_SEED_DEMO_NAME:Demo Fancier}
    demo-password: ${VLUGBOEK_SEED_DEMO_PASSWORD:demo123}
  mailer:
    url: ${VLUGBOEK_MAILER_URL:http://127.0.0.1:8788/send-document}
    token: ${VLUGBOEK_MAILER_TOKEN:}
  build:
    version: ${VLUGBOEK_BUILD_VERSION:0.0.1-SNAPSHOT}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${VLUGBOEK_DB_URL:jdbc:postgresql://localhost:5432/vlugboek}
    username: ${VLUGBOEK_DB_USER:vlugboek}
    password: ${VLUGBOEK_DB_PASSWORD:vlugboek}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

vlugboek:
  seed:
    pdf-import-enabled: ${VLUGBOEK_SEED_PDF_IMPORT_ENABLED:false}
    admin-enabled: ${VLUGBOEK_SEED_ADMIN_ENABLED:false}
    admin-password: ${VLUGBOEK_SEED_ADMIN_PASSWORD:}
    demo-users-enabled: ${VLUGBOEK_SEED_DEMO_USERS_ENABLED:false}
